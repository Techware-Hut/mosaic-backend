name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA from main to deploy
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME || 'mosaic-biz-hub-backend' }}
  EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME || 'mosaic-backend-env' }}
  PRODUCTION_API_URL: https://api.mosaicbizhub.com

jobs:
  resolve-release:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate release SHA
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          PUSH_SHA: ${{ github.sha }}
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
              echo "Production deployment must be dispatched from the main branch"
              exit 1
            fi
            candidate="$REQUESTED_RELEASE_SHA"
            if [[ ! "$candidate" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "release_sha must be a full 40-character Git commit SHA"
              exit 1
            fi
          else
            candidate="$PUSH_SHA"
          fi

          git cat-file -e "${candidate}^{commit}" 2>/dev/null || {
            echo "Release commit does not exist in this repository"
            exit 1
          }

          release_sha=$(git rev-parse "${candidate}^{commit}")
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release commit is not reachable from origin/main"
            exit 1
          }

          echo "Validated release commit: $release_sha"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    needs:
      - resolve-release
      - test
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Verify external checkout gate
        run: bash scripts/release/verify-checkout-gate.sh "$PRODUCTION_API_URL"

      - name: Create deployment package
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        run: |
          cat > release-manifest.json <<EOF
          {
            "commit": "$RELEASE_SHA",
            "environment": "production",
            "deploymentVersion": "mosaic-$RELEASE_SHA"
          }
          EOF
          shopt -s dotglob
          zip -r deploy.zip . \
            -x "*.git*" \
            -x "*node_modules/*" \
            -x "*.env*" \
            -x "*tests/*" \
            -x "*docs/*" \
            -x "*.github/*" \
            -x "*.zip" \
            -x "*logs/*" \
            -x "*.log" \
            -x "debug-data.js" \
            -x "fix-product-data.js" \
            -x "fix-variants.js" \
            -x "test-products.js" \
            -x "*.txt"

      - name: Configure AWS credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          output-credentials: true

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ steps.aws_creds.outputs.aws-access-key-id }}
          aws_secret_key: ${{ steps.aws_creds.outputs.aws-secret-access-key }}
          aws_session_token: ${{ steps.aws_creds.outputs.aws-session-token }}
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          region: ${{ env.AWS_REGION }}
          version_label: mosaic-${{ needs.resolve-release.outputs.release_sha }}
          deployment_package: deploy.zip
          use_existing_version_if_available: true
          wait_for_deployment: true
          wait_for_environment_recovery: true

      - name: Verify every EB instance deployment
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        run: bash scripts/release/verify-eb-instance-versions.sh "$RELEASE_SHA"

      - name: Post-deploy health probe
        run: |
          echo "Deployed commit: ${{ needs.resolve-release.outputs.release_sha }}"
          echo "Version label: mosaic-${{ needs.resolve-release.outputs.release_sha }}"
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /tmp/health.json -w "%{http_code}" "${PRODUCTION_API_URL}/")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 15
          done
          echo "Health probe failed after 5 attempts"
          exit 1

      - name: Post-deploy auth probe
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "${PRODUCTION_API_URL}/api/users/auth/check")
          echo "Auth check (unauthenticated): HTTP $status"
          if [ "$status" != "401" ]; then
            echo "Expected 401 for unauthenticated auth/check"
            exit 1
          fi

      - name: Post-deploy readiness probe
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        run: |
          for path in /api/health /api/ready /api/build-info; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${PRODUCTION_API_URL}${path}")
            echo "${path}: HTTP $status"
            if [ "$status" != "200" ]; then
              echo "Expected 200 for ${path}"
              exit 1
            fi
          done

          curl -fsS "${PRODUCTION_API_URL}/api/health" > /tmp/api-health.json
          curl -fsS "${PRODUCTION_API_URL}/api/build-info" > /tmp/api-build-info.json
          node - "$RELEASE_SHA" <<'NODE'
          const fs = require('fs');
          const expectedSha = process.argv[2];
          const expectedShortSha = expectedSha.slice(0, 7);
          const expectedVersion = `mosaic-${expectedSha}`;

          for (const file of ['/tmp/api-health.json', '/tmp/api-build-info.json']) {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            const release = payload.release;
            if (!release?.commit || !release?.environment || !release?.deploymentVersion) {
              throw new Error(`Missing release identity in ${file}`);
            }
            if (release.commit !== expectedShortSha) {
              throw new Error(
                `Release commit mismatch in ${file}: expected ${expectedShortSha}, got ${release.commit}`
              );
            }
            if (release.deploymentVersion !== expectedVersion) {
              throw new Error(
                `Version mismatch in ${file}: expected ${expectedVersion}, got ${release.deploymentVersion}`
              );
            }
          }

          console.log(`Public release identity matches ${expectedVersion}`);
          NODE

      - name: Post-deploy CORS probe
        env:
          LAUNCH_ORIGIN: https://mosaic-biz-frontend-launch.vercel.app
          VERCEL_PRODUCTION_ORIGIN: https://mosaic-biz-frontend-launch-digital-builders.vercel.app
          VERCEL_MAIN_ORIGIN: https://mosaic-biz-frontend-launch-git-main-digital-builders.vercel.app
          VERCEL_DEVELOP_ORIGIN: https://mosaic-biz-frontend-launch-git-develop-digital-builders.vercel.app
          APEX_ORIGIN: https://mosaicbizhub.com
          LEGACY_APP_ORIGIN: https://app.mosaicbizhub.com
        run: |
          for origin in "$APEX_ORIGIN" "$LEGACY_APP_ORIGIN" "$LAUNCH_ORIGIN" "$VERCEL_PRODUCTION_ORIGIN" "$VERCEL_MAIN_ORIGIN" "$VERCEL_DEVELOP_ORIGIN"; do
            echo "CORS OPTIONS for Origin: $origin"
            headers=$(curl -s -D - -o /dev/null -X OPTIONS \
              -H "Origin: $origin" \
              -H "Access-Control-Request-Method: GET" \
              "${PRODUCTION_API_URL}/api/featured-products")
            echo "$headers" | grep -i "access-control-allow-origin: $origin" || {
              echo "Missing Access-Control-Allow-Origin for $origin"
              exit 1
            }
          done
          status=$(curl -s -o /dev/null -w "%{http_code}" "${PRODUCTION_API_URL}/api/featured-products")
          echo "GET /api/featured-products: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Expected 200 for featured-products GET"
            exit 1
          fi

      - name: Deployment summary
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Commit | \`$RELEASE_SHA\` |"
            echo "| Version label | \`mosaic-$RELEASE_SHA\` |"
            echo "| EB application | \`${{ env.EB_APPLICATION_NAME }}\` |"
            echo "| EB environment | \`${{ env.EB_ENVIRONMENT_NAME }}\` |"
            echo "| Region | \`${{ env.AWS_REGION }}\` |"
            echo "| API URL | \`${{ env.PRODUCTION_API_URL }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
