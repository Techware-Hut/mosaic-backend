name: Enforce staging to main

on:
  # The base-branch workflow is the policy authority. This job never checks out
  # or executes pull-request code.
  pull_request_target:
    branches:
      - main

permissions:
  contents: read

jobs:
  enforce-staging-source:
    name: Enforce staging promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact canonical staging source
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$HEAD_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "::error::Pull requests to main must originate in the canonical repository."
            exit 1
          fi
          if [ "$HEAD_REF" != "staging" ]; then
            echo "::error::Pull requests to main must originate from the staging branch."
            exit 1
          fi

          canonical_sha=$(gh api \
            "repos/$EXPECTED_REPOSITORY/git/ref/heads/staging" \
            --jq '.object.sha')
          if [ "$HEAD_SHA" != "$canonical_sha" ]; then
            echo "::error::Pull request head is not the exact current canonical staging SHA."
            exit 1
          fi

          echo "Exact canonical staging source is eligible for promotion."
          echo "The independently required App-owned status supplies trusted certification."
