name: Prove production-preflight OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prove-production-preflight-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-preflight
    steps:
      - name: Require main ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            printf '%s\n' 'FAIL: main ref required'
            exit 1
          fi
          printf '%s\n' 'PASS: main ref'

      - name: Check out exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove OIDC and read-only production topology access
        shell: bash
        env:
          ROLE_TO_ASSUME: ${{ secrets.AWS_PREFLIGHT_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME || 'mosaic-biz-hub-backend' }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME || 'mosaic-backend-env' }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          fail() {
            printf '%s\n' 'FAIL: production-preflight OIDC/topology proof'
            exit 1
          }
          [[ -n "${ROLE_TO_ASSUME:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || fail
          [[ -n "${AWS_REGION:-}" && -n "${EB_APPLICATION_NAME:-}" && -n "${EB_ENVIRONMENT_NAME:-}" ]] || fail

          proof_dir="$(mktemp -d "$RUNNER_TEMP/preflight-oidc.XXXXXX" 2>/dev/null)" || fail
          trap 'rm -rf "$proof_dir"' EXIT
          : > "$proof_dir/empty"
          export AWS_SHARED_CREDENTIALS_FILE="$proof_dir/empty"
          export AWS_CONFIG_FILE="$proof_dir/empty"
          export AWS_EC2_METADATA_DISABLED=true
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_DEFAULT_PROFILE

          oidc_token="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode 'audience=sts.amazonaws.com' \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" 2>/dev/null | jq -er '.value' 2>/dev/null)" || fail
          [[ -n "$oidc_token" ]] || fail

          credentials="$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_TO_ASSUME" \
            --region "$AWS_REGION" \
            --role-session-name "preflight-${GITHUB_RUN_ID}" \
            --web-identity-token "$oidc_token" \
            --duration-seconds 900 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text 2>/dev/null)" || fail
          unset oidc_token
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<< "$credentials"
          unset credentials
          [[ -n "${AWS_ACCESS_KEY_ID:-}" && -n "${AWS_SECRET_ACCESS_KEY:-}" && -n "${AWS_SESSION_TOKEN:-}" ]] || fail
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

          if ! node 2>/dev/null <<'NODE'
          'use strict';
          const { collectAwsTopology } = require('./scripts/release/aws-release-topology');
          const { createAwsCliRunner } = require('./scripts/release/release-control-utils');
          try {
            collectAwsTopology({
              runAws: createAwsCliRunner(),
              region: process.env.AWS_REGION,
              applicationName: process.env.EB_APPLICATION_NAME,
              environmentName: process.env.EB_ENVIRONMENT_NAME,
            });
          } catch (_) {
            process.exitCode = 1;
          }
          NODE
          then
            fail
          fi
          printf '%s\n' 'PASS: production-preflight OIDC/topology proof'
